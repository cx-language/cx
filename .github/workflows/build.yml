name: Build

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Platform legs are independent; a toolchain flake on one OS
      # must not cancel validation of the others.
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        build_type: [ Debug, RelWithDebInfo ]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Set up LLVM 23 and link dependencies
        uses: ./.github/actions/setup-llvm

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      # Unity build for Release legs only: optimized compiles are slow,
      # so merging translation units saves most there. Debug legs stay
      # non-unity, which keeps checking for missing includes and ODR
      # violations. (Switched from the matrix because multi-config
      # generators ignore CMAKE_BUILD_TYPE at configure time.)
      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="$LLVMDIR${EXTRA_CMAKE_PREFIX:+;$EXTRA_CMAKE_PREFIX}" -DCMAKE_UNITY_BUILD=${{ matrix.build_type == 'Debug' && 'OFF' || 'ON' }} $EXTRA_CMAKE_ARGS ${DIA_CMAKE_DIR:+-DMSVC_DIA_SDK_DIR="$DIA_CMAKE_DIR"}

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          # Build wall-clock stamps for the benchmark record. Python timestamps
          # keep this portable: BSD date has no %N and git-bash has no bc.
          python3 -c "import time; print(time.time())" > "$RUNNER_TEMP/cx_build_start"
          cmake --build . --config ${{ matrix.build_type }}
          python3 -c "import time; print(time.time())" > "$RUNNER_TEMP/cx_build_end"

      # Full test runs stay on Release legs only: unoptimized Debug
      # binaries are several-fold slower per compiler invocation, and the
      # suites spawn thousands of them (26-29min Test steps). Assertions
      # are enabled in all configurations (NDEBUG is stripped in
      # CMakeLists.txt), so Release legs already check them; Debug legs
      # only verify the build compiles.
      # SDL3 is built from source (no libsdl3-dev on Ubuntu 24.04); cache
      # the clone and build tree so only the install reruns. Bump the key
      # with the branch below. Release-only, like the Test step that uses it.
      - name: Cache SDL build (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type != 'Debug'
        uses: actions/cache@v5
        with:
          path: /tmp/SDL
          key: sdl-release-3.4.16

      # Same for raylib 6.0 (Ubuntu 24.04 predates it).
      - name: Cache raylib build (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type != 'Debug'
        uses: actions/cache@v5
        with:
          path: /tmp/raylib
          key: raylib-6.0

      # SDL3 and GLFW for the Windows example builds, via vcpkg's dynamic
      # triplet (SDL3.lib and glfw3dll.lib import libraries, which the
      # vendor build files link). OpenGL itself needs no package: modern
      # entry points load at runtime via gl-loader.cx. Release-only, like
      # the Test step that uses them. Shares the binary-cache directory
      # with zlib/zstd above; entries carry ABI hashes, so the two keys
      # coexist safely.
      - name: Cache vcpkg binaries (Windows SDL/GLFW)
        if: matrix.os == 'windows-latest' && matrix.build_type != 'Debug'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ steps.vcpkg-baseline.outputs.sha }}-sdl3-glfw3-dynamic

      - name: Install SDL3 and GLFW (Windows)
        if: matrix.os == 'windows-latest' && matrix.build_type != 'Debug'
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite"
        run: |
          vcpkg install sdl3:x64-windows glfw3:x64-windows

      - name: Test
        if: matrix.build_type != 'Debug'
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          pip install "lit==23.*" psutil
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            # pkg-config installs on every run: the driver shells out to it
            # at check time (queryPkgConfigFlags aborts without it), so a
            # cache hit must not skip it.
            sudo apt-get install -y libglfw3-dev pkg-config
            # Reuse the cached SDL tree only when the built library is
            # present; a cache entry saved from a failed build must trigger
            # a rebuild, not a broken install.
            if [ ! -f "/tmp/SDL/build/libSDL3.so" ]; then
              rm -rf /tmp/SDL
              # Build dependencies for SDL3, see https://wiki.libsdl.org/SDL3/README-linux
              # (no libsdl3-dev on Ubuntu 24.04, so build SDL3 from source below).
              sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
              git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git /tmp/SDL
              cmake -S /tmp/SDL -B /tmp/SDL/build -DCMAKE_BUILD_TYPE=Release
              cmake --build /tmp/SDL/build --parallel
            fi
            sudo cmake --install /tmp/SDL/build
            if [ ! -f "/tmp/raylib/build/raylib/libraylib.so" ]; then
              rm -rf /tmp/raylib
              # Build dependencies for raylib, see
              # https://github.com/raysan5/raylib/wiki/Working-on-GNU-Linux
              # Installed in full here (not reusing the SDL list above) so a
              # raylib cache miss still builds on an SDL cache hit.
              sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
              git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git /tmp/raylib
              # Shared library: tests link plain `pkg-config --libs raylib`,
              # which omits the private X11/ALSA deps a static link would need.
              cmake -S /tmp/raylib -B /tmp/raylib/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
              cmake --build /tmp/raylib/build --parallel
            fi
            sudo cmake --install /tmp/raylib/build
            sudo ldconfig
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install sdl3 glfw raylib
          fi
          # SDL3 and GLFW were installed via vcpkg above on Windows; raylib is
          # not installed there, so tests depending on it stay disabled.
          # Time only the check invocation, not the SDL/apt setup above it.
          python3 -c "import time; print(time.time())" > "$RUNNER_TEMP/cx_check_start"
          CX_PRINT_STACK_TRACE=true cmake --build . --config ${{ matrix.build_type }} --target check
          python3 -c "import time; print(time.time())" > "$RUNNER_TEMP/cx_check_end"
          # Slow suites excluded from the default check gate (see CMakeLists.txt).
          CX_PRINT_STACK_TRACE=true ctest --output-on-failure -L slow -C ${{ matrix.build_type }}

      # Benchmarks run in this leg only: the compiler is already built here,
      # so the marginal cost is just the corpus timing (under a minute).
      # Runs on PRs too, which validates that the corpus still compiles
      # warning-free; only main commits are recorded (see bench-record).
      - name: Benchmark corpus
        if: matrix.os == 'ubuntu-latest' && matrix.build_type != 'Debug'
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          elapsed() { python3 -c "import sys; print(float(open(sys.argv[2]).read()) - float(open(sys.argv[1]).read()))" "$1" "$2"; }
          build_s=$(elapsed "$RUNNER_TEMP/cx_build_start" "$RUNNER_TEMP/cx_build_end")
          check_s=$(elapsed "$RUNNER_TEMP/cx_check_start" "$RUNNER_TEMP/cx_check_end")
          python3 "$GITHUB_WORKSPACE/scripts/bench-corpus.py" --cx ./cx \
            --build-seconds "$build_s" --check-seconds "$check_s" --output "$RUNNER_TEMP/bench.json"

      - name: Upload benchmark record
        if: matrix.os == 'ubuntu-latest' && matrix.build_type != 'Debug'
        uses: actions/upload-artifact@v6
        with:
          name: bench-record
          path: ${{ runner.temp }}/bench.json

      # Ships the compiler to the bench-langs job: the binary plus every
      # shared library it needs (the Ubuntu build links LLVM shared), so
      # that job needs no toolchain install. The copy is stripped: bench
      # runs don't need debug info, and it would triple the upload.
      - name: Upload cx compiler (Ubuntu release)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type != 'Debug' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cx-dist"
          cp "${{ runner.workspace }}/build/cx" "$RUNNER_TEMP/cx-dist/cx"
          strip "$RUNNER_TEMP/cx-dist/cx"
          # Dereference: the loader resolves by the soname ldd prints,
          # which becomes the copy's file name.
          ldd "${{ runner.workspace }}/build/cx" | grep -o '/[^ ]*' | while read -r lib; do
            cp -L "$lib" "$RUNNER_TEMP/cx-dist/"
          done
          ls "$RUNNER_TEMP/cx-dist"

      - name: Upload cx compiler artifact (Ubuntu release)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type != 'Debug' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: cx-ubuntu-release
          path: ${{ runner.temp }}/cx-dist

  # LeakSanitizer gate for the AST arena no-malloc contract: an
  # LSan-instrumented cx-lsp runs repeated LSP analyses with arena resets
  # and fails on per-reset growth (see test/lsp/check_lsan.py). Linux-only:
  # Apple Clang lacks -fsanitize=leak and Windows has no LSan. Runs on PRs
  # like the lit suites: allocator regressions must fail before merge.
  lsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Cache apt archives (Ubuntu)
        uses: actions/cache@v5
        with:
          path: |
            /tmp/apt-archives
            !/tmp/apt-archives/lock
            !/tmp/apt-archives/partial
          key: apt-archives-llvm-23-sdl-glfw

      - name: Redirect apt archives (Ubuntu)
        run: |
          mkdir -p /tmp/apt-archives/partial
          echo 'Dir::Cache::Archives "/tmp/apt-archives";' | sudo tee /etc/apt/apt.conf.d/99-ci-cache

      - name: Download LLVM (Ubuntu)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all

      - name: Configure CMake (LSan)
        shell: bash
        run: >
          cmake -S . -B build-lsan -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=/usr/lib/llvm-23/bin/clang
          -DCMAKE_CXX_COMPILER=/usr/lib/llvm-23/bin/clang++
          -DCMAKE_PREFIX_PATH=/usr/lib/llvm-23 -DCX_SANITIZE_LEAK=ON

      - name: Build cx-lsp (LSan)
        shell: bash
        run: cmake --build build-lsan --target cx-lsp --parallel

      - name: LSan arena gate
        shell: bash
        run: python3 test/lsp/check_lsan.py --cx-lsp build-lsan/cx-lsp

  # AddressSanitizer gate: an ASan-instrumented cx compiles and runs an
  # AST-node-heavy fixture (which implicitly imports std), and cx-lsp runs
  # repeated analyses with arena resets (see test/asan/check_asan.py).
  # Linux-only like the LSan gate. Runs on PRs like the lit suites: memory
  # errors must fail before merge.
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Cache apt archives (Ubuntu)
        uses: actions/cache@v5
        with:
          path: |
            /tmp/apt-archives
            !/tmp/apt-archives/lock
            !/tmp/apt-archives/partial
          key: apt-archives-llvm-23-sdl-glfw

      - name: Redirect apt archives (Ubuntu)
        run: |
          mkdir -p /tmp/apt-archives/partial
          echo 'Dir::Cache::Archives "/tmp/apt-archives";' | sudo tee /etc/apt/apt.conf.d/99-ci-cache

      - name: Download LLVM (Ubuntu)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all

      - name: Configure CMake (ASan)
        shell: bash
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=/usr/lib/llvm-23/bin/clang
          -DCMAKE_CXX_COMPILER=/usr/lib/llvm-23/bin/clang++
          -DCMAKE_PREFIX_PATH=/usr/lib/llvm-23 -DCX_SANITIZE_ADDRESS=ON

      - name: Build cx and cx-lsp (ASan)
        shell: bash
        run: cmake --build build-asan --target cx cx-lsp --parallel

      - name: ASan gate
        shell: bash
        run: python3 test/asan/check_asan.py --cx build-asan/cx --cx-lsp build-asan/cx-lsp

  # The language comparison takes ~11 minutes, longer than the rest of the
  # Ubuntu release leg combined, so it runs here in parallel with the other
  # legs instead of appended to that leg. Main-only like bench-record: the
  # lit suites already validate the compiler on PRs, and bench edits are
  # fixed forward if they break the comparison.
  # Runs whenever the Ubuntu leg produced a compiler, independent of the
  # other legs' outcome like the matrix legs themselves; the artifact
  # download fails first if the Ubuntu leg did.
  bench-langs:
    needs: [ build ]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Download cx compiler
        uses: actions/download-artifact@v7
        with:
          name: cx-ubuntu-release
          path: cx-dist

      # Language comparison needs Odin and Zig; Go, Rust, and Swift ship with the runner.
      # Bump the keys with the versions in the install step below.
      - name: Cache Odin
        uses: actions/cache@v5
        with:
          path: /tmp/odin
          key: odin-dev-2026-09

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: /tmp/zig
          key: zig-0.16.0

      - name: Install Odin and Zig
        shell: bash
        run: |
          if [ ! -x "/tmp/odin/odin" ]; then
            rm -rf /tmp/odin /tmp/odin-dl
            mkdir -p /tmp/odin-dl
            curl -L --fail --show-error "https://github.com/odin-lang/Odin/releases/download/dev-2026-09/odin-linux-amd64-dev-2026-09.tar.gz" --output /tmp/odin.tar.gz
            tar -xzf /tmp/odin.tar.gz -C /tmp/odin-dl
            mv /tmp/odin-dl/odin-* /tmp/odin
          fi
          if [ ! -x "/tmp/zig/zig" ]; then
            rm -rf /tmp/zig /tmp/zig-dl
            mkdir -p /tmp/zig-dl
            curl -L --fail --show-error "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" --output /tmp/zig.tar.xz
            tar -xf /tmp/zig.tar.xz -C /tmp/zig-dl
            mv /tmp/zig-dl/zig-* /tmp/zig
          fi
          echo "/tmp/odin" >> $GITHUB_PATH
          echo "/tmp/zig" >> $GITHUB_PATH
          # bench-langs skips missing toolchains with a warning, which would
          # silently ship incomplete comparison data, so fail fast instead.
          command -v go || { echo "go missing"; exit 1; }
          command -v rustc || { echo "rustc missing"; exit 1; }
          command -v cc || { echo "cc missing"; exit 1; }
          command -v c++ || { echo "c++ missing"; exit 1; }
          command -v swiftc || { echo "swiftc missing"; exit 1; }
          go version
          rustc --version
          swiftc --version
          /tmp/odin/odin version
          /tmp/zig/zig version

      - name: Benchmark languages
        shell: bash
        run: |
          chmod +x cx-dist/cx
          # CX_ROOT points at the checked-out repo: the compiler finds std/
          # there instead of beside an installed binary.
          export CX_ROOT="$GITHUB_WORKSPACE"
          export LD_LIBRARY_PATH="$PWD/cx-dist"
          python3 scripts/bench-langs.py --cx ./cx-dist/cx \
            --output "$RUNNER_TEMP/langs.json" --html "$RUNNER_TEMP/langs.html"

      - name: Upload language comparison record
        uses: actions/upload-artifact@v6
        with:
          name: langs-record
          path: ${{ runner.temp }}/langs.json

  bench-record:
    if: github.ref == 'refs/heads/main'
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download benchmark record
        uses: actions/download-artifact@v7
        with:
          name: bench-record
          path: bench-record

      - name: Append to bench-data tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha=$(python3 -c "import json; print(json.load(open('bench-record/bench.json'))['sha'])")
          # History lives on a floating tag, not a branch: GitHub banners
          # every branch push ("had recent pushes") but never tags. Each run
          # appends one commit on the tag tip; --force-with-lease keeps
          # concurrent runs from overwriting each other.
          for _ in 1 2 3 4 5; do
            # Tag fetches never overwrite a local tag, so drop ours first; a
            # failed push leaves it pointing at the unpushed commit.
            git tag -d bench-data 2>/dev/null || true
            git fetch origin tag bench-data || true
            old=$(git rev-parse --verify -q refs/tags/bench-data || true)
            if [ -n "$old" ]; then
              git checkout -q refs/tags/bench-data
            else
              # First run: build the root commit on a scratch branch, reused
              # across retries and never pushed as a branch.
              git checkout -q bench-data-tmp 2>/dev/null || git checkout -q --orphan bench-data-tmp
              # --orphan keeps the main checkout in the index; drop it so the
              # tag tree holds only bench.jsonl. Untracked bench-record/ survives.
              git rm -rf -q .
            fi
            # A failed push may still have landed; never record twice.
            if grep -q "$sha" bench.jsonl 2>/dev/null; then
              echo "commit $sha is already recorded"
              exit 0
            fi
            cat bench-record/bench.json >> bench.jsonl
            git add bench.jsonl
            git commit -m "bench: $sha"
            git tag -f bench-data
            # An empty lease expects the tag to be absent: first-run bootstrap.
            if git push --force-with-lease=refs/tags/bench-data:"$old" origin refs/tags/bench-data; then
              pushed=1
              break
            fi
            sleep 10
          done
          [ "${pushed:-0}" = 1 ]

  build-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          echo "$GITHUB_WORKSPACE/emsdk" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> $GITHUB_PATH

      - name: Cache LLVM for WebAssembly
        uses: actions/cache@v5
        with:
          path: wasm/build/llvm-build
          key: llvm-wasm-23.1.1-${{ hashFiles('wasm/build-frontend.sh') }}

      - name: Build frontend to WebAssembly
        run: ./wasm/build-frontend.sh wasm/dist

      - name: Build in-browser C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-23-tools || sudo apt-get install -y llvm
          export PATH="/usr/lib/llvm-23/bin:$PATH"
          ./wasm/build-xcc-dist.sh wasm/dist

      - name: Test website JS
        run: |
          node website/test-bench.mjs
          node website/test-cx-mode.mjs
          node website/test-install.mjs
          node wasm/test-editor.mjs
          node wasm/test-playground.mjs
          node wasm/test-playground-worker.mjs
          node wasm/test-search.mjs
          node wasm/test-wasi-shim.mjs wasm/dist
          node wasm/test-pipeline.mjs wasm/dist
          node wasm/smoke-playground.mjs wasm/dist

      - name: Upload playground artifacts
        uses: actions/upload-artifact@v6
        with:
          name: playground
          path: |
            wasm/dist/cx-wasm.js
            wasm/dist/cx-wasm.wasm
            wasm/dist/cx-wasm.data
            wasm/dist/cc.wasm
            wasm/dist/wcc-files.zip

  deploy-website:
    if: github.ref == 'refs/heads/main'
    needs: [ build, build-playground, bench-langs ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Download playground artifacts
        uses: actions/download-artifact@v7
        with:
          name: playground
          path: wasm/dist

      - name: Download language comparison record
        uses: actions/download-artifact@v7
        with:
          name: langs-record
          path: langs-record
        continue-on-error: true

      - name: Build website
        run: |
          # Pin pandoc: default styles and fenced-code parsing vary
          # between releases, so CI must build with a known version.
          wget --no-verbose https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc-3.11-1-amd64.deb

          (
            cd website || exit 1
            ./build-website.sh
          )

          touch website/build/.nojekyll

      # History for the /bench graphs. Best-effort: a missing tag or
      # record must not fail the deploy; the page shows a stub instead.
      - name: Attach benchmark data
        run: |
          git fetch origin tag bench-data --depth 1 || true
          git show refs/tags/bench-data:bench.jsonl > /tmp/bench.jsonl 2>/dev/null || : > /tmp/bench.jsonl
          python3 -c "import json; lines = [line for line in open('/tmp/bench.jsonl') if line.strip()]; json.dump([json.loads(line) for line in lines], open('website/build/bench-data.json', 'w'))" || echo '[]' > website/build/bench-data.json

      # Language comparison for the /bench page, from this run's bench.
      # Best-effort like the history above.
      - name: Attach language comparison data
        run: |
          if [ -f "langs-record/langs.json" ]; then
            cp "langs-record/langs.json" website/build/langs-data.json
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
