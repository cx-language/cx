name: Build

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Platform legs are independent; a toolchain flake on one OS
      # must not cancel validation of the others.
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        build_type: [ Debug, RelWithDebInfo ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Download LLVM (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all
          echo "/usr/lib/llvm-23/bin" >> $GITHUB_PATH

      - name: Download LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Refresh Homebrew first: a stale snapshot installs an older LLVM
          # bottle (e.g. 23.1.0, whose libclangDriver.a ships an LLVM-bitcode
          # object that the system linker can't parse).
          brew update
          brew install llvm@23
          echo LLVMDIR=$(brew --prefix llvm@23) >> $GITHUB_ENV

      - name: Download LLVM (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          curl -L "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/clang+llvm-23.1.1-x86_64-pc-windows-msvc.tar.xz" --output llvm.tar.xz && 7z x llvm.tar.xz && 7z x llvm.tar
          # The sed below converts the path to a Windows-style path
          echo LLVMDIR="$(echo "$PWD/clang+llvm-23.1.1-x86_64-pc-windows-msvc" | sed -e 's/^\///' -e 's/\//\\/g' -e 's/^./\0:/')" >> $GITHUB_ENV

      # LLVM 22+ locates the DIA SDK via $VSINSTALLDIR (see llvm/cmake/modules/FindDIASDK.cmake),
      # which is only set inside a Visual Studio developer environment.
      - name: Set up MSVC environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Provide DIA SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # LLVM's LLVMDebugInfoPDB target needs diaguids.lib. Its FindDIASDK
          # module only looks at $VSINSTALLDIR, which may point at an install
          # without it, so search wider and pass an explicit path if needed.
          DIA_CMAKE_DIR=""
          if [ -f "$VSINSTALLDIR/DIA SDK/lib/amd64/diaguids.lib" ]; then
            echo "DIA SDK found via VSINSTALLDIR"
          else
            VSWHERE="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            if [ -f "$VSWHERE" ]; then
              mapfile -t VS_INSTALLS < <("$VSWHERE" -products '*' -property installationPath)
              for INSTALL_PATH in "${VS_INSTALLS[@]}"; do
                INSTALL_PATH_UNIX=$(echo "$INSTALL_PATH" | tr -d '\r' | sed -e 's/\\/\//g')
                if [ -f "$INSTALL_PATH_UNIX/DIA SDK/lib/amd64/diaguids.lib" ]; then
                  DIA_CMAKE_DIR="$INSTALL_PATH_UNIX/DIA SDK"
                  break
                fi
              done
            fi
            if [ -z "$DIA_CMAKE_DIR" ]; then
              # Fall back to the DIA files shipped in the Windows SDK, staged
              # into the layout FindDIASDK expects.
              DIA_LIB=$(ls -d "/c/Program Files (x86)/Windows Kits/10/Lib/"*"/um/x64/diaguids.lib" 2>/dev/null | sort -r | head -n 1 || true)
              DIA_INC=$(echo "$DIA_LIB" | sed -e 's#/Lib/\(.*\)/um/x64/diaguids.lib#/Include/\1/um/dia2.h#')
              if [ -n "$DIA_LIB" ] && [ -f "$DIA_INC" ]; then
                DIA_STAGE="$RUNNER_TEMP/dia-sdk"
                mkdir -p "$DIA_STAGE/include" "$DIA_STAGE/lib/amd64"
                cp "$DIA_LIB" "$DIA_STAGE/lib/amd64/diaguids.lib"
                cp "$DIA_INC" "$DIA_STAGE/include/dia2.h"
                DIA_CMAKE_DIR=$(echo "$DIA_STAGE" | sed -e 's/\\/\//g')
              fi
            fi
            if [ -z "$DIA_CMAKE_DIR" ]; then
              echo "ERROR: DIA SDK with lib/amd64/diaguids.lib not found in VSINSTALLDIR, any VS instance, or the Windows Kits"
              exit 1
            fi
            echo "DIA SDK found at: $DIA_CMAKE_DIR"
            echo "DIA_CMAKE_DIR=$DIA_CMAKE_DIR" >> $GITHUB_ENV
          fi

      # LLVM 22+ links LLVMSupport against the ZLIB::ZLIB and zstd::libzstd_static
      # imported targets, so findable ZLIB and zstd are required at configure
      # time. Use the static triplets to match the /MT runtime used with the
      # prebuilt LLVM.
      # Note: vcpkg names the static libs zs/zsd, which FindZLIB only
      # searches for with ZLIB_USE_STATIC_LIBS=ON. Similarly, LLVM's Findzstd
      # module only defines zstd::libzstd_static for a library literally named
      # zstd_static.lib, which vcpkg doesn't ship (only zstd.lib), so copy it.
      - name: Install zlib and zstd (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          vcpkg install zlib:x64-windows-static zstd:x64-windows-static
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib/zstd.lib" "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib/zstd_static.lib"
          ls "$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib"
          echo "EXTRA_CMAKE_PREFIX=$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static" >> $GITHUB_ENV
          echo "EXTRA_CMAKE_ARGS=-DZLIB_USE_STATIC_LIBS=ON" >> $GITHUB_ENV

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH="$LLVMDIR${EXTRA_CMAKE_PREFIX:+;$EXTRA_CMAKE_PREFIX}" -DCMAKE_UNITY_BUILD=OFF $EXTRA_CMAKE_ARGS ${DIA_CMAKE_DIR:+-DMSVC_DIA_SDK_DIR="$DIA_CMAKE_DIR"}

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build . --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: |
          pip install lit psutil
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install libglfw3-dev
            # Build dependencies for SDL3, see https://wiki.libsdl.org/SDL3/README-linux
            # (no libsdl3-dev on Ubuntu 24.04, so build SDL3 from source below).
            sudo apt-get install -y pkg-config ninja-build libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
            git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git /tmp/SDL
            cmake -S /tmp/SDL -B /tmp/SDL/build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/SDL/build --parallel
            sudo cmake --install /tmp/SDL/build
            sudo ldconfig
          fi
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install sdl3 glfw3
          fi
          # Tests depending on SDL3 or GLFW are disabled on Windows CI.
          CX_PRINT_STACK_TRACE=true cmake --build . --config ${{ matrix.build_type }} --target check

  build-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install latest
          ./emsdk/emsdk activate latest
          echo "$GITHUB_WORKSPACE/emsdk" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> $GITHUB_PATH

      - name: Cache LLVM for WebAssembly
        uses: actions/cache@v4
        with:
          path: wasm/build/llvm-build
          key: llvm-wasm-23.1.1-${{ hashFiles('wasm/build-frontend.sh') }}

      - name: Build frontend to WebAssembly
        run: ./wasm/build-frontend.sh wasm/dist

      - name: Build in-browser C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-23-tools || sudo apt-get install -y llvm
          export PATH="/usr/lib/llvm-23/bin:$PATH"
          ./wasm/build-xcc-dist.sh wasm/dist

      - name: Test playground
        run: |
          node wasm/test-wasi-shim.mjs wasm/dist
          node wasm/test-pipeline.mjs wasm/dist
          node wasm/smoke-playground.mjs wasm/dist

      - name: Upload playground artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playground
          path: |
            wasm/dist/cx-wasm.js
            wasm/dist/cx-wasm.wasm
            wasm/dist/cx-wasm.data
            wasm/dist/cc.wasm
            wasm/dist/wcc-files.zip

  deploy-website:
    if: github.ref == 'refs/heads/main'
    needs: [ build, build-playground ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download playground artifacts
        uses: actions/download-artifact@v4
        with:
          name: playground
          path: wasm/dist

      - name: Build website
        run: |
          # Pin pandoc: default styles and fenced-code parsing vary
          # between releases, so CI must build with a known version.
          wget --no-verbose https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc-3.11-1-amd64.deb

          (
            cd docs || exit 1
            ./build-website.sh
          )

          touch docs/build/.nojekyll

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
