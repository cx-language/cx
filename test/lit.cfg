# -*- Python -*-
# Configuration file for the LLVM Integrated Tester.

import atexit
import lit.formats
import os
import platform
import shutil
import tempfile

cx = lit_config.params.get("cx_path")
filecheck = lit_config.params.get("filecheck_path")
test_dir = lit_config.params.get("test_dir")
llvm_version = lit_config.params.get("llvm_version")

# lit tracks LLVM releases; a newer or older lit than the LLVM in use has
# different builtin substitutions, so fail loudly on skew.
if llvm_version is not None:
    lit_version = getattr(lit, "__version__", None)
    if lit_version is not None and lit_version.split(".")[0] != str(llvm_version).split(".")[0]:
        lit_config.fatal(f"lit {lit_version} does not match LLVM {llvm_version}; install lit {llvm_version}.x (pip install 'lit=={llvm_version}.*')")

env = dict(os.environ)
# Uncomment this to print compiler stack traces for debugging test failures:
# env["CX_PRINT_STACK_TRACE"] = "true"
if platform.system() == "Windows":
    # DbgHelp symbolization of the huge Debug binaries exceeds the per-test
    # time budget on cold CI runners; crashes still print traces via LLVM's
    # own signal handlers.
    env.pop("CX_PRINT_STACK_TRACE", None)

config.name = "cx"
# Every lit process gets a private execution root: lit reads and rewrites
# .lit_test_times.txt there on every run, which corrupts the file when many
# processes (one CTest test per file) share a root. This also keeps the
# per-test Output/ scratch directories out of the source tree. Tests must
# not depend on the working directory; anchor paths on %S instead.
config.test_exec_root = tempfile.mkdtemp(prefix="cx-lit-")
atexit.register(shutil.rmtree, config.test_exec_root, ignore_errors=True)
# Scratch directory for tests that write output files. Newer lit versions no
# longer provide %T as a builtin, so define it here. Like the execution
# root, it is private to each lit process (one CTest shard).
test_tmp_dir = tempfile.mkdtemp(prefix="cx-lit-T-")
atexit.register(shutil.rmtree, test_tmp_dir, ignore_errors=True)
config.test_format = lit.formats.ShTest()
config.suffixes = [".cx"]
config.excludes = ["inputs"]
config.test_source_root = os.path.dirname(__file__)
config.substitutions.append(("%cx", f"'{cx}'"))
config.substitutions.append(("%T", test_tmp_dir))
config.substitutions.append(("%FileCheck", f"'{filecheck}' -implicit-check-not error:"))
config.substitutions.append(("check_exit_status", f"python3 '{test_dir}/check_exit_status'"))
config.substitutions.append(("file-exists", f"python3 '{test_dir}/file-exists'"))
config.substitutions.append(("check-snapshots", f"python3 '{test_dir}/check-snapshots' '{cx}' '%s'"))
config.substitutions.append(("%not", f"python3 '{test_dir}/not'"))
config.substitutions.append(("cat", f"python3 '{test_dir}/cat'"))
config.substitutions.append(("true", f"python3 '{test_dir}/true'"))
config.environment = env
config.target_triple = ""
config.available_features.add(platform.system().lower())
# Cold Debug binaries start slowly on Windows CI; allow headroom so the
# first tests of the run don't time out before the disk cache warms up.
# Multi-invocation tests also need headroom with Debug binaries on loaded
# runners (every test binary embeds the full stdlib, so compile times grow
# with it), as do slow-executing Debug tests like map-tests. A timeout only
# costs time when a test actually hangs, so err generous.
config.maxIndividualTestTime = 120
